<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Taktline">
  <title>Taktline</title>
  <!-- Four stations on one line, each held for a beat longer than the last: the takt the whole
       app is about. Reads at 16px because it is four shapes and one rule, nothing finer. -->
  <rect width="64" height="64" rx="14" fill="#0D9488"/>
  <g fill="#FFFFFF">
    <rect x="13" y="34" width="7" height="10" rx="2"/>
    <rect x="24" y="28" width="7" height="16" rx="2"/>
    <rect x="35" y="22" width="7" height="22" rx="2"/>
    <rect x="46" y="16" width="7" height="28" rx="2"/>
  </g>
  <rect x="13" y="48" width="40" height="3" rx="1.5" fill="#99F6E4"/>
</svg>
